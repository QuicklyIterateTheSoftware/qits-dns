# The application config for qits-dns as a standalone process.
#
# This module is the deployable, so this file is read at ordinal 250 and is the app's own settings —
# as opposed to a library jar's META-INF/microprofile-config.properties at ordinal 100, which is how
# a context ships DEFAULTS it does not own the deployment of. The `dns` module's own defaults (its
# datasource, Flyway lineage, listener host/port, TTL, token) stay there; a deployment still
# overrides any of them by env.

quarkus.application.name=qits-dns

# The prefix every HTTP route of this service lives under: /<segment>/api, where the segment is the
# service name without the qits- prefix. qits-gateway routes VERBATIM by prefix — /dns/* reaches
# qits-dns with the path untouched — so the service itself has to serve /dns/..., and there is no
# unprefixed form. This holds for service-to-service calls on qits-net too; they do not pass through
# the gateway but they address the same paths.
#
# None of this touches the DNS listener, which is not HTTP and not behind the gateway at all: DNS
# arrives on its own UDP/TCP port, on the same public IP, as a sibling of the gateway rather than a
# route through it.
quarkus.rest.path=/dns/api

# Quarkus' non-application root — what the framework serves rather than application code. It sits
# OUTSIDE quarkus.rest.path, so it has to carry the segment on its own or it stays at / and is
# unreachable through the gateway.
quarkus.http.non-application-root-path=/dns/q

# --- the API document -------------------------------------------------------------------------
# Served at /dns/q/openapi, with the browsable UI at /dns/q/swagger-ui — both follow
# quarkus.http.non-application-root-path above (quarkus.swagger-ui.path is relative by default, so
# it moves along; do not pin it). always-include because swagger-ui is a dev-mode-only extension by
# default, and the point of packaging these as processes is that each documents its own surface in
# a real deployment.
quarkus.smallrye-openapi.info-title=qits-dns API
quarkus.swagger-ui.always-include=true

# --- what a deployment MUST override -----------------------------------------------------------
# Deliberately NOT pinned here, because any value this repo picks would be wrong and wrong quietly:
#
#   qits.dns.ns-names    Comma-separated list of this server's public NS hostnames (ns1.qits.eu,...),
#                        whose first entry is also the SOA's mname. Blank ships, and blank means
#                        SOA/NS synthesis is OFF — a boot log line says so. A delegated zone whose
#                        server answers no SOA is broken in a way that shows up as slow negative
#                        caching rather than as an outage, so this is the setting that separates a
#                        working delegation from one that merely appears to answer.
#
#   qits.dns.hostmaster  The SOA's rname, as a hostname (hostmaster.qits.eu). Same story: blank ships
#                        and disables synthesis together with ns-names, because a hostmaster address
#                        this repo invented would be a lie that resolves.
#
#   qits.dns.token       Blank means the record-management API's write verbs are unauthenticated.
#                        That is the dev default and stays a no-op guard until a deployment sets it.
#                        Reads are open by design. Note that a write here changes what a public
#                        nameserver answers.
#
# NOT in that list but worth stating: the DNS listener's default port is 8053, not 53, because
# binding below 1024 needs privileges this process should not hold. The deployment publishes
# 53:8053/udp AND 53:8053/tcp — both, since an authoritative server that refuses TCP fails every
# truncation retry — or grants NET_BIND_SERVICE and sets qits.dns.port=53.

# --- the dnsjava codec in a native image ---------------------------------------------------------
# Both lines below were proven necessary by ABLATION against a real GraalVM build: remove either and
# the native image fails. They are the whole of what dnsjava costs us in the image, and they are the
# reason §5's "codec only" is enforced by the build rather than by good intentions.

# dnsjava's org.xbill.DNS.Header holds `private static final Random random = new SecureRandom()`,
# read by the no-arg Header()/Message() ctor to pick a random query ID. GraalVM refuses a
# Random/SecureRandom instance in the image heap, so Header must initialize at run time. We never
# call the no-arg ctor, but <clinit> runs on any first touch of the class.
quarkus.native.additional-build-args=--initialize-at-run-time=org.xbill.DNS.Header

# Sever dnsjava's resolver/lookup stack at its root. The jar ships a
# java.net.spi.InetAddressResolverProvider service file, which makes DnsjavaInetAddressResolver ->
# Lookup -> ResolverConfig -> {Android,Windows}ResolverConfigProvider reachable from any
# InetAddress.getHostName(); those reference android.net.ConnectivityManager and com.sun.jna.Pointer,
# neither on the classpath, and Quarkus's blanket link-at-build-time turns that into a hard failure.
# Worse, Lookup.<clinit> reads the BUILD MACHINE's /etc/resolv.conf and freezes it into the binary.
# This line is also the mechanical enforcement of "codec only": import Lookup and the native build
# fails loudly instead of shipping the builder's DNS config.
# NOTE the backslash — `:` is a key/value separator in .properties and must be escaped.
quarkus.class-loading.removed-resources."dnsjava\:dnsjava"=META-INF/services/java.net.spi.InetAddressResolverProvider,META-INF/services/sun.net.spi.nameservice.NameServiceDescriptor

# --- the packaged artifact -----------------------------------------------------------------------
# Name the build output `qits-dns` rather than qits-dns-service-<version>-runner, so `-Dnative`
# produces target/qits-dns and the process is identifiable in `ps`. The name is spelled TWICE: here,
# and as failsafe's native.image.path in service/pom.xml. They move together — if they drift, the
# native IT launches nothing and passes.
quarkus.package.output-name=qits-dns
quarkus.package.jar.add-runner-suffix=false

# --- telemetry --------------------------------------------------------------------------------
# One key names the receiver: qits.observability.url — scheme, host and port, NO path. The ingest
# path is qits-observability's own and belongs to the service, not to the deployment, so it is
# spelled once here and derived rather than configured. Point this at a collector or a different
# host and everything below follows.
qits.observability.url=http://qits-observability:8080

# http/protobuf, not the gRPC default: the receiver is OtelReceiverResource over HTTP, and the
# exporter appends /v1/<signal> to this base — so this resolves to the three ingest routes at
# /observability/api/otel/v1/{traces,logs,metrics}.
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${qits.observability.url}/observability/api/otel

# Logs ride the same exporter; traces are on by default. The receiver decodes all three signals, and
# a log record correlated to a trace is most of why the receiver exists.
quarkus.otel.logs.enabled=true

# Dark outside a deployment. A clone-alone `./mvnw verify` and a `quarkus:dev` have no
# qits-observability to reach, and an exporter retrying against an unresolvable host turns every
# suite into a wall of export failures. The deployment is where telemetry is real.
%dev.quarkus.otel.sdk.disabled=true
%test.quarkus.otel.sdk.disabled=true
