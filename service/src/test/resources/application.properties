# Test-only overrides. This module is the deployable, so its app-level settings live in
# src/main/resources/application.properties and Quarkus MERGES that file into the test config — it is
# not shadowed by this one. Never re-declare an app-level setting here: a test copy that drifts from
# the shipped copy makes the suite lie, passing on a value no deployment ever gets. That is why
# quarkus.rest.path is absent below, and why the wire and API suites address the real /dns/... paths.
#
# What belongs here is only what a test run genuinely needs to be different: the in-memory database,
# and a listener port that cannot collide.

# The service suite runs against in-memory H2 (no docker), overriding the file-H2 default shipped in
# the dns jar's META-INF/microprofile-config.properties. Its own database name, distinct from the
# dns module's own suite, so the two never share an in-JVM instance. clean-at-start wipes between
# runs.
quarkus.datasource.dns.db-kind=h2
quarkus.datasource.dns.jdbc.url=jdbc:h2:mem:dns-svc;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.dns.datasource=dns
quarkus.hibernate-orm.dns.packages=eu.wohlben.qits.dns.entity
quarkus.flyway.dns.migrate-at-start=true
quarkus.flyway.dns.clean-at-start=true
quarkus.flyway.dns.locations=classpath:db/dns/migration

# The DNS listener binds a REAL UDP and TCP socket in the test suite — that is the point of the wire
# tests, which drive it with a real client. 0 asks the OS for an ephemeral port so the suite never
# fights a developer's own server, a parallel module build, or a second Quarkus instance for 8053.
# A test reads the actual port back off the bound socket.
qits.dns.port=0
