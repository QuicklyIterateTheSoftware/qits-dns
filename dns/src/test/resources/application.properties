# The dns suite runs against in-memory H2 (no docker), overriding the file-H2 default shipped in
# this jar's META-INF/microprofile-config.properties. clean-at-start wipes between runs.
#
# The named PU and the Flyway lineage are restated rather than inherited because the datasource is
# being replaced: `quarkus.datasource.dns.*` here defines a different datasource than the jar
# default did, and the PU->datasource and Flyway->location bindings have to name it again for the
# test config to describe a complete unit.
quarkus.datasource.dns.db-kind=h2
quarkus.datasource.dns.jdbc.url=jdbc:h2:mem:dns;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.dns.datasource=dns
quarkus.hibernate-orm.dns.packages=eu.wohlben.qits.dns.entity
quarkus.flyway.dns.migrate-at-start=true
quarkus.flyway.dns.clean-at-start=true
quarkus.flyway.dns.locations=classpath:db/dns/migration
