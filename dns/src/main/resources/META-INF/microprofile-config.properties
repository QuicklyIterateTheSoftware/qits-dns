# DNS config defaults, shipped from this library jar. Library jars ship defaults as
# META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties is ignored
# — read by whichever app pulls the jar in. The consuming app / env overrides any of these.
#
# dns owns its OWN named datasource + persistence unit + Flyway lineage: a separate file-based H2
# under ~/.qits/data/dns, never sharing another module's DB or its migration history, so the module
# is extraction-shaped from day one (the qits-ci arrangement, ported). Tests override the url to
# in-memory H2 (see src/test/resources/application.properties in this and the service module).
#
# The URL carries NO AUTO_SERVER, and that is not a style choice. AUTO_SERVER makes the first opener
# start H2's own TCP server, and org.h2.server.TcpServer is not in a GraalVM native image — the
# qits-ci binary died at boot with `Class "org.h2.server.TcpServer" not found` while every JVM test
# there stayed green. Registering the server classes was the alternative and it is the wrong trade:
# AUTO_SERVER buys a second process opening the same file, which a packaged single-process service
# does not do, and it costs a database port listening on every interface — on a host that, here,
# already has a socket facing the open internet. Do not add it back.
quarkus.datasource.dns.db-kind=h2
quarkus.datasource.dns.jdbc.url=jdbc:h2:file:${user.home}/.qits/data/dns/h2/dns

# A dedicated persistence unit bound to the dns datasource, owning only this module's entities.
# `packages` assigns entity->PU unambiguously; there is no default datasource in this app at all,
# which is exactly the qits-ci arrangement and works for the same reason — a NAMED persistence unit
# names its own datasource and never falls back to the default one.
quarkus.hibernate-orm.dns.datasource=dns
quarkus.hibernate-orm.dns.packages=eu.wohlben.qits.dns.entity

# Own Flyway lineage at a distinct classpath location, hand-written and appended to.
quarkus.flyway.dns.migrate-at-start=true
quarkus.flyway.dns.locations=classpath:db/dns/migration

# --- the DNS listener ----------------------------------------------------------------------------
# Host and port for BOTH the UDP and the TCP listener. 8053 rather than 53 because binding a port
# below 1024 needs privileges this process should not have; the deployment maps 53 -> 8053 for both
# protocols (or grants NET_BIND_SERVICE). Tests override the port to 0 — the suite binds real
# sockets, and an ephemeral port is what keeps a parallel run from fighting a developer's own
# server for 8053.
qits.dns.host=0.0.0.0
qits.dns.port=8053

# Default TTL for records that carry none, and the SOA's `minimum`. Low on purpose: these names
# point at deployments, deployments move, and a name that takes an hour to follow its deployment is
# worse than one extra query per minute.
qits.dns.ttl-seconds=60

# --- what SOA/NS synthesis needs, and why it is blank --------------------------------------------
# ns-names is the comma-separated list of THIS server's public NS hostnames (ns1.qits.eu,...) —
# its first entry is also the SOA's mname. hostmaster is the SOA's rname, written as a hostname
# (hostmaster.qits.eu).
#
# BOTH ARE BLANK ON PURPOSE, the qits-ci daemon-version stance: this repo cannot know its own public
# names, and a default it invented would be a lie that resolves — a delegated zone answering SOA
# with a nameserver hostname nobody registered is worse than one answering no SOA at all, because
# the first looks configured. Blank means SOA/NS synthesis is DISABLED and a boot log line says so.
# A/AAAA/CNAME are still answered, so dev and the whole test suite work untouched; a real
# delegation requires setting both, and the log line is where that requirement is discoverable.
#
# INJECT THE THREE BLANK KEYS BELOW AS Optional<String>, NOT String. SmallRye Config reads an empty
# value as UNSET, so a plain `@ConfigProperty(name = "qits.dns.ns-names") String` fails the whole
# deployment at boot with `Failed to load config value of type class java.lang.String` — a boot
# failure caused by shipping the documented default. qits-ci carries the same note on qits.ci.token
# for the same reason.
qits.dns.ns-names=
qits.dns.hostmaster=

# Static token guarding the record-management API's write verbs (reads are open). Blank => the guard
# is a no-op (dev/test), exactly like qits.ci.token. See the Optional<String> note above.
qits.dns.token=
